version: analytics_v1
timezone: Asia/Kolkata
timestamp_convention: Local naive timestamps in declared timezone; all windows are
  half-open [start,end).
posting: Completed meters/states/sensors at interval end; heat outcomes at heat end;
  production registers at shift end, plus configured posting delay.
forecasting: Select only task allowlisted columns with column availability <= forecast_origin.
  Same-slot energy/PF cannot predict same-slot energy.
missingness: Unknown values stay null. No backward fill, centered windows or future
  interpolation.
inventory: Latest published shift-end inventory joined backward at interval START;
  opening stock is a static known balance. No inferred 15-minute physical stock/output.
labels: Events and fault labels are evaluation-only and never enter predictor loaders.
